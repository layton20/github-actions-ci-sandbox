name: Build and Test .NET

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BookWrom/BookWrom.sln

      - name: Build
        run: dotnet build BookWrom/BookWrom.sln --no-restore --configuration Release

      - name: Run tests and generate results
        run: |
          mkdir -p TestResults
          dotnet test BookWrom/BookWrom.sln --configuration Release --logger "trx;LogFileName=bookwrom_test_results.trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: BookWrom.Tests/TestResults/bookwrom_test_results.trx

